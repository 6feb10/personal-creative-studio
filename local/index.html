<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DreamStudio</title>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#7c5cff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="DreamStudio">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
.hero { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 1.6rem 1.5rem 0.8rem; }
.hero-sigil { width: 50px; height: 50px; position: relative; margin-bottom: 0.9rem; animation: breathe 4s ease-in-out infinite; }
.hero-sigil::before { content: ''; position: absolute; inset: 0; border: 2px solid var(--orchid); border-radius: 50%; animation: spin 20s linear infinite; }
.hero-sigil::after { content: '✦'; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; color: var(--rose-gold); }
@keyframes breathe { 0%,100% { filter: drop-shadow(0 0 6px rgba(124,92,255,0.25)); } 50% { filter: drop-shadow(0 0 14px rgba(124,92,255,0.4)); } }
@keyframes spin { to { transform: rotate(360deg); } }
.hero-title { font-family: 'M PLUS Rounded 1c', sans-serif; font-weight: 800; font-size: clamp(1.7rem, 8vw, 2.6rem); letter-spacing: 0.01em; line-height: 1.1; white-space: nowrap; background: linear-gradient(135deg, #7c5cff 0%, #ff7eb6 60%, #f59e7a 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.hero-sub { font-family: 'M PLUS Rounded 1c', sans-serif; font-size: 0.62rem; letter-spacing: 0.3em; color: var(--orchid); opacity: 0.7; margin-top: 0.5rem; }
.hero-quote { font-weight: 400; font-size: 0.82rem; color: rgba(58,47,74,0.6); margin-top: 0.8rem; line-height: 1.6; }

.gates { padding: 0.3rem 1rem 0.5rem; }
.group { margin-bottom: 0.7rem; }
.group-label { font-family: 'M PLUS Rounded 1c', sans-serif; font-weight: 700; font-size: 0.62rem; letter-spacing: 0.14em; color: rgba(124,92,255,0.55); margin: 0 0 0.4rem 0.25rem; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; }
.stack { display: flex; flex-direction: column; gap: 0.6rem; }

.tile { display: flex; align-items: center; gap: 0.6rem; background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 14px; padding: 0.9rem 0.85rem; text-decoration: none; color: inherit; position: relative; overflow: hidden; min-height: 56px; box-shadow: 0 2px 12px rgba(124,92,255,0.05); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); -webkit-tap-highlight-color: transparent; transition: transform 0.2s; }
.tile::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent, var(--orchid), transparent); opacity: 0.3; }
.tile:active { transform: scale(0.97); }
.tile-icon { font-size: 1.4rem; flex-shrink: 0; }
.tile-body { flex: 1; min-width: 0; }
.tile-name { font-family: 'M PLUS Rounded 1c', sans-serif; font-weight: 700; font-size: 0.92rem; color: var(--pearl); letter-spacing: 0.01em; line-height: 1.2; }
.tile-desc { font-size: 0.7rem; color: rgba(58,47,74,0.55); margin-top: 0.15rem; }
.tile-count { font-size: 0.6rem; color: rgba(124,92,255,0.6); letter-spacing: 0.05em; margin-top: 0.2rem; }

.tile--wide { padding: 1.05rem 1rem; background: linear-gradient(135deg, rgba(124,92,255,0.14), rgba(255,126,182,0.10)); border-color: rgba(124,92,255,0.32); box-shadow: 0 4px 18px rgba(124,92,255,0.12); }
.tile--wide .tile-icon { font-size: 1.7rem; }
.tile--wide .tile-name { font-size: 1.05rem; }

.settings-area { text-align: center; padding: 0.8rem 0 2.2rem; }
.settings-link { font-size: 0.75rem; color: rgba(124,92,255,0.7); text-decoration: none; letter-spacing: 0.06em; font-family: 'M PLUS Rounded 1c', sans-serif; }
</style>
</head>
<body>
<div class="cosmos"></div>
<div class="page" style="padding-top: var(--safe-top);">
  <section class="hero">
    <div class="hero-sigil"></div>
    <h1 class="hero-title">Dream Studio</h1>
    <p class="hero-sub">— your creative studio —</p>
    <p class="hero-quote">思い描いた物語を、かたちにする場所。</p>
  </section>

  <nav class="gates">
    <div class="group">
      <div class="group-label">アイデア・設定</div>
      <div class="grid2">
        <a href="memoria.html" class="tile"><span class="tile-icon">📚</span>
          <div class="tile-body"><div class="tile-name">プロット</div><span class="tile-count" id="c-memoria"></span></div></a>
        <a href="cradle.html" class="tile"><span class="tile-icon">🏠</span>
          <div class="tile-body"><div class="tile-name">キャラクター</div><span class="tile-count" id="c-cradle"></span></div></a>
      </div>
    </div>

    <div class="group">
      <a href="forge.html" class="tile tile--wide"><span class="tile-icon">✨</span>
        <div class="tile-body"><div class="tile-name">AI生成</div><div class="tile-desc">物語のたねを書く</div></div>
        <span class="tile-count" id="c-forge"></span></a>
    </div>

    <div class="group">
      <div class="group-label">保存・閲覧</div>
      <div class="stack">
        <a href="desire.html" class="tile"><span class="tile-icon">📖</span>
          <div class="tile-body"><div class="tile-name">ノベル</div><div class="tile-desc">物語を言葉に</div></div>
          <span class="tile-count" id="c-desire"></span></a>
        <a href="reverie.html" class="tile"><span class="tile-icon">🖼️</span>
          <div class="tile-body"><div class="tile-name">ギャラリー</div><div class="tile-desc">画像の展示室</div></div>
          <span class="tile-count" id="c-reverie"></span></a>
      </div>
    </div>

    <div class="group">
      <div class="group-label">ストック</div>
      <div class="grid2">
        <a href="spark.html" class="tile"><span class="tile-icon">💡</span>
          <div class="tile-body"><div class="tile-name">メモ</div><span class="tile-count" id="c-spark"></span></div></a>
        <a href="sanctum.html" class="tile"><span class="tile-icon">🔖</span>
          <div class="tile-body"><div class="tile-name">ブックマーク</div><span class="tile-count" id="c-sanctum"></span></div></a>
      </div>
    </div>
  </nav>

  <div class="settings-area"><a href="settings.html" class="settings-link">⚙ 設定・バックアップ・AIキー</a></div>
</div>

<script src="js/db.js"></script>
<script src="js/ui.js"></script>
<script src="js/store.js"></script>
<script>
(async () => {
  await DS.appInit();
  const set = (id, n) => { const el = document.getElementById(id); if (el) el.textContent = n; };
  const [bases, residents, novels, images, projects, bookmarks, gens, notes] = await Promise.all([
    DB.count('bases'), DB.count('residents'), DB.count('novels'),
    DB.count('images'), DB.count('projects'), DB.count('bookmarks'), DB.count('forgeGenerations'),
    DB.all('notes'),
  ]);
  set('c-cradle', `${bases}拠点 · ${residents}人`);
  set('c-forge', `${gens}回`);
  set('c-desire', `${novels}作`);
  set('c-reverie', `${images}枚`);
  set('c-memoria', `${projects}件`);
  set('c-sanctum', `${bookmarks}件`);
  const openTasks = notes.filter(n => n.cat === 'task' && !n.done).length;
  set('c-spark', openTasks ? `ToDo ${openTasks} · ${notes.length}` : `${notes.length}件`);
})();
</script>
</body>
</html>
